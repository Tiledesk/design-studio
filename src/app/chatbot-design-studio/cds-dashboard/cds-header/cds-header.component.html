<div class="header-left" [class.is_opened]="IS_OPEN_SIDEBAR" 
        matTooltip="{{ 'GoBack' | translate}}"  
        matTooltipClass="cds-mat-tooltip"
        matTooltipHideDelay="100"
        matTooltipPosition='below'
        #tooltip="matTooltip">
    <div *ngIf="!IS_OPEN_SIDEBAR">
        <img class="logo" [src]="LOGOS_ITEMS['BASE_LOGO_NO_TEXT'].icon">
        <!-- <span class="material-icons" (click)="goToBack()">arrow_back</span> -->
        <span class="material-icons" [matMenuTriggerFor]="menu">more_vert</span>
    </div>
    <img *ngIf="IS_OPEN_SIDEBAR" [src]="LOGOS_ITEMS['BASE_LOGO'].icon">
</div>
<div class="header-right">

            chevron_left
        </span>
        <span *ngIf="!IS_OPEN_SIDEBAR" class="material-icons toggle-setting-sidebar-icon">
            chevron_right
        </span>
    </div> -->
    <!-- <i class="material-icons cds-btn-back" (click)="goBack()">keyboard_arrow_left</i> -->
    <!-- Agent chat toggle: takes the leftmost spot in header-right, where the
         wordmark used to sit. This cell renders unconditionally -- .header-right
         is a 3-column grid, and .header-title needs to stay in the middle column
         whether or not the button inside is shown, so the *ngIf goes on the
         button, not the cell. It drives the canvas, so it has no meaning on a
         section where the canvas is not present (isBlockSectionActive guard),
         and needs the host to be configured (isAgentChatAvailable). -->
    <div class="btn-group header-agent-chat-btn">
        <button *ngIf="isBlockSectionActive && isAgentChatAvailable"
            id="cds-agent-chat-btn"
            class="btn btn-primary cds-blue-button"
            type="button"
            [title]="'CDS.AgentChat.Toggle' | translate"
            (click)="onToggleAgentChat()">
            <span class="material-icons">auto_awesome</span>
        </button>
    </div>
    <div class="header-title ellips">
        {{ selectedChatbot?.name }}
        <span class="material-icons" *ngIf="(SHARE_MENU_ITEMS | filter:{key: 'status', value: 'active' }).length > 0" [matMenuTriggerFor]="menuShare">ios_share</span>
    </div>
    <div class="right-opts">

        <div *ngIf="isBlockSectionActive" class="btn-group" id="cds-publish-btn-wrp" [ngStyle]="{'z-index':popup_visibility === 'block' ? '1051' : '1' }">
            <button *ngIf="(!isPlaying && isWebhook) || !isWebhook" id="cds-publish-btn" class="btn btn-primary cds-blue-button" type="button"
                [disabled]="isSaving"
                (click)="onClickPublish()">
                <!-- <span class="material-icons">
                    cached
                </span> -->
                <span *ngIf="!isSavingVisible">{{ 'Publish' | translate}}</span>
                <span *ngIf="isSavingVisible" class="cds-btn-inline-spinner">
                    <span class="cds-btn-spinner"></span>{{ 'CDSCanvas.Saving' | translate}}...
                </span>
                <span *ngIf="selectedChatbot?.modified"
                  class="publish-badge"
                  [matTooltip]="'CDSHeader.ThereAreUnpublishedChanges' | translate"
                  matTooltipClass="cds-mat-tooltip"
                  matTooltipPosition="below"
                  matTooltipHideDelay="100">
                </span>
            </button>
            

            <!-- <button mat-icon-button [matMenuTriggerFor]="releasehistory"  class="custom-mat-icon-btn">
                <mat-icon> arrow_drop_down </mat-icon>
            </button> -->

            </button> -->

                            Deploy on Community
                        </div>

                    </a>
                    <a class="custom---anchor" *ngIf="selectedChatbot?.public === true"

                        <div class="btn-in-dropdown">
                            Remove from community

                <li>

        </div>

        <div *ngIf="TRY_ON_WA === true && isBlockSectionActive && !isWebhook && !isPlaying" class="btn-group">
            <button id="cds-test-it-wab-out-btn" class="btn btn-primary cds-blue-button" type="button" (click)="openWhatsappPage()">
                <img width="18px" height="18px" src="assets/images/channel_icons/whatsapp-logo_green.svg">
                {{ 'TryOnWhatsapp' | translate}}
            </button>
        </div>

        <div *ngIf="webhookUrl && isPlaying && isWebhook" class="btn-group box-url" 
                matTooltipClass="cds-mat-tooltip"
                matTooltip="{{ 'Copy Dev url' | translate}}" #tooltip="matTooltip" matTooltipPosition='below'
                matTooltipHideDelay="100"
                (click)="copyText(true)">
            <div class="button-url">
                <span class="span-url ellips">{{webhookUrl}}</span>
                <div *ngIf="messageWebhookUrl !== ''" class="webhook-message fade-in-out">
                    <span>{{ messageWebhookUrl }}</span>
                </div>
            </div>
        </div>

        <div *ngIf="isBlockSectionActive" class="btn-group"
                matTooltipClass="cds-mat-tooltip"
                matTooltip="{{ 'TestIt' | translate}}" #tooltip="matTooltip" matTooltipPosition='below'
                matTooltipHideDelay="100">
            <button *ngIf="!isPlaying" id="cds-test-it-out-btn" class="btn btn-primary pull-right cds-blue-button" type="button" (click)="onOpenTestItOut()">
                <mat-icon class="toggle-setting-sidebar-icon2" svgIcon="play" aria-hidden="true"></mat-icon>
            </button>
            <button *ngIf="isPlaying" id="cds-test-it-out-btn" class="btn btn-primary pull-right cds-blue-button button-stop" type="button" (click)="onCloseTestItOut()">
                <mat-icon class="" svgIcon="stop" aria-hidden="true"></mat-icon>
            </button>
        </div>

    </div>
</div>






<!-- HEADER MENU OPTIONS-->
<mat-menu #menu="matMenu" class="menuElement" xPosition="after">
    <ng-template matMenuContent>
        <cds-menu
            [items]="LOGO_MENU_ITEMS"
            (onMenuOption)="onMenuOptionFN($event)">
        </cds-menu>
    </ng-template>
</mat-menu>

<!-- SHARE MENU OPTIONS -->
<mat-menu #menuShare="matMenu" class="menuElement shareMenu" xPosition="after" yPosition="below">
    <ng-template matMenuContent>
        <cds-menu
            [items]="SHARE_MENU_ITEMS"
            [menuType]="''"
            [menuTitle]="'SharePrototype' | translate "
            (onMenuOption)="onMenuOptionFN($event)">
        </cds-menu>
    </ng-template>
</mat-menu>

<!-- PLAY MENU OPTIONS-->
<mat-menu #menuPlay="matMenu" class="menuElement playMenu" xPosition="after" yPosition="below">
    <ng-template matMenuContent>
        <cds-menu
            [items]="PLAY_MENU_ITEMS"
            [menuType]="''"
            (onMenuOption)="onMenuOptionFN($event)">
        </cds-menu>
    </ng-template>
</mat-menu>
