<div *ngIf="previewMode" class="cds-action-preview">

    <div class="action-row">
        <div class="action-row-left">
            <span class="material-icons">person_add</span>
        </div>
        <div class="action-row-right">
            <span *ngIf="action?.members"><b>{{ action.members }}</b></span>
            <span *ngIf="!action?.members && selectedDepartmentName"><b>{{ selectedDepartmentName }}</b></span>
            <span *ngIf="!action?.members && !selectedDepartmentName" class="empty">{{ 'CDSCanvas.InviteHumanConversationDepartment' | translate }}</span>
        </div>
    </div>

    <div class="previewContent">
        <label class="title-preview-label"><b>{{ 'CDSCanvas.InviteHumanInvited' | translate }}</b></label>
        <cds-connector class="connector-true"
            [idConnector]="idConnectorTrue"
            [idConnection]="idConnectionTrue"
            [isConnected]="isConnectedTrue">
        </cds-connector>
    </div>

    <hr class="preview-divider">

    <div class="previewContent">
        <label class="title-preview-label">{{ 'CDSCanvas.InviteHumanNoHuman' | translate }}</label>
        <cds-connector class="connector-false"
            [idConnector]="idConnectorFalse"
            [idConnection]="idConnectionFalse"
            [isConnected]="isConnectedFalse">
        </cds-connector>
    </div>

</div>

<div *ngIf="!previewMode">
    <div class="content-panel-intent-detail">

        <div class="field-box">
            <label class="title-label">{{ 'CDSCanvas.InviteHumanDepartment' | translate }}</label>
            <cds-select id="invite-human-department"
                [items]="departments"
                [bindLabelSelect]="'name'"
                [bindValueSelect]="'_id'"
                [itemSelected]="action?.departmentId"
                [placeholder]="'CDSCanvas.InviteHumanConversationDepartment' | translate"
                [clearable]="true"
                (onSelected)="onChangeDepartment($event)"
                (onReset)="onResetDepartment()">
            </cds-select>
        </div>

        <div class="field-box">
            <label class="title-label">{{ 'CDSCanvas.InviteHumanMembers' | translate }}</label>
            <cds-textarea id="invite-human-members"
                [text]="action?.members"
                [placeholder]="'CDSCanvas.InviteHumanMembersPlaceholder' | translate"
                [showUtils]="true"
                [setAttributeBtn]="true"
                [emojiPikerBtn]="false"
                [textLimitBtn]="false"
                [minRow]="1"
                [maxRow]="4"
                (changeTextarea)="onChangeMembers($event)">
            </cds-textarea>
            <label class="field-description">{{ 'CDSCanvas.InviteHumanMembersDescription' | translate }}</label>
        </div>

        <hr class="custom-divider">

        <div class="field-box">
            <div class="condition-container">
                <span class="condition-text">{{ 'CDSCanvas.InviteHumanInvited' | translate }}</span>
            </div>
            <cds-select id="invite-human-true"
                [items]="listOfIntents"
                [bindLabelSelect]="'name'"
                [bindValueSelect]="'value'"
                [itemSelected]="action?.trueIntent"
                [placeholder]="'CDSCanvas.SelectABlock' | translate"
                [clearable]="true"
                (onSelected)="onChangeSelect($event, 'trueIntent')"
                (onReset)="onResetBlockSelect($event, 'trueIntent')">
            </cds-select>
        </div>

        <div class="field-box">
            <div class="condition-container">
                <span class="condition-text">{{ 'CDSCanvas.InviteHumanNoHuman' | translate }}</span>
            </div>
            <cds-select id="invite-human-false"
                [items]="listOfIntents"
                [bindLabelSelect]="'name'"
                [bindValueSelect]="'value'"
                [itemSelected]="action?.falseIntent"
                [placeholder]="'CDSCanvas.SelectABlock' | translate"
                [clearable]="true"
                (onSelected)="onChangeSelect($event, 'falseIntent')"
                (onReset)="onResetBlockSelect($event, 'falseIntent')">
            </cds-select>
        </div>

    </div>
</div>
