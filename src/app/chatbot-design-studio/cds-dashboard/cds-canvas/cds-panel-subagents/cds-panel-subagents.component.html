<div class="content">

    <!-- Intestazione nella cornice condivisa con i pannelli dei blocchi e delle azioni: le tre
         schede si alternano nello stesso slot, e partire da altezze o pesi diversi si legge come
         un salto. La freccia fa la stessa cosa della linguetta attiva nella striscia: chi ha il
         pannello sotto gli occhi non deve cercare la linguetta per toglierlo di mezzo. -->
    <div class="lp-head-title">
        <span class="lp-head-title__text">{{ 'CDSCanvas.Subagents' | translate }}</span>
        <button type="button" class="lp-head-title__close"
            [attr.aria-label]="'Close' | translate"
            (click)="onClosePanel()">
            <mat-icon class="icon" svgIcon="chevron_left" aria-hidden="true"></mat-icon>
        </button>
    </div>

    <!-- Casella di ricerca nascosta su richiesta. La logica di filtro resta in
         onSearch()/applyFilter(): senza termine, filteredSubagents = tutti. Volendola, la fascia
         e' quella dei due pannelli accanto: `lp-search-head` piu' `search-box`. -->

    <!-- Lista: parent (sempre primo) + subagent -->
    <div class="subagents-list" *ngIf="IS_OPEN">

        <!-- Il parent apre la famiglia e sta in cima, staccato da una riga: lo stesso posto e lo
             stesso trattamento che nell'elenco dei blocchi hanno l'avvio e il fallback. -->
        <div *ngIf="parentItem" class="subagent-item parent-item"
            [class.active]="parentItem._id === currentId"
            (click)="openAgent(parentItem._id)">
            <div class="icon-container">
                <mat-icon class="icon" svgIcon="groups" aria-hidden="true"></mat-icon>
            </div>
            <span class="subagent-name">{{ parentItem.name }}</span>
        </div>

        <!-- Subagent. Nessun `title`: il riquadro che il browser ne ricava compariva sopra la
             riga accanto e sopra le linguette, e ripeteva un nome che e' gia' li' scritto. -->
        <div *ngFor="let sa of filteredSubagents" class="subagent-item"
            [class.active]="sa._id === currentId"
            (click)="openAgent(sa._id)">
            <div class="icon-container">
                <mat-icon class="icon" svgIcon="person" aria-hidden="true"></mat-icon>
            </div>
            <span class="subagent-name">{{ sa.name }}</span>

            <!-- Azioni del subagent. Si apre in hover e si chiude 1s dopo l'uscita del mouse
                 (il timer e' annullato rientrando sul bottone o sul pannello).
                 stopPropagation: il click non deve navigare sulla riga.
                 Presente solo sui subagent: il parent non e' eliminabile da qui. -->
            <button type="button" class="subagent-menu-btn"
                #subagentTrigger="matMenuTrigger"
                [matMenuTriggerFor]="subagentMenu"
                (click)="$event.stopPropagation()"
                (mouseenter)="onSubagentMenuEnter(subagentTrigger)"
                (mouseleave)="onSubagentMenuLeave(subagentTrigger)">
                <span class="material-icons">more_vert</span>
            </button>
            <mat-menu #subagentMenu="matMenu" class="subagent-menu-panel"
                xPosition="before" [hasBackdrop]="false">
                <div class="subagent-menu-content"
                    (mouseenter)="onSubagentMenuEnter(subagentTrigger)"
                    (mouseleave)="onSubagentMenuLeave(subagentTrigger)">
                    <div class="subagent-menu-item" (click)="onDeleteSubagent(sa, $event)">
                        <div class="subagent-menu-item-icon">
                            <span class="material-icons-outlined">delete</span>
                        </div>
                        <div class="subagent-menu-item-text truncate">{{ 'CDSCanvas.DeleteSubagent' | translate }}</div>
                    </div>
                </div>
            </mat-menu>
        </div>

        <!-- Empty state (nessun subagent) -->
        <div *ngIf="!isLoading && filteredSubagents.length === 0" class="subagents-empty">
            <mat-icon class="empty-icon" svgIcon="groups" aria-hidden="true"></mat-icon>
            <p class="empty-text">{{ 'CDSCanvas.NoSubagentsYet' | translate }}</p>
        </div>

        <!-- New subagent: subito sotto l'ultimo della lista, quindi scorre con essa.
             Visibile anche DENTRO un subagent: il nuovo agent viene creato sotto il
             parent della famiglia (familyParentId), cosi' si ottiene un fratello e
             non un annidamento. -->
        <div class="subagents-new" *ngIf="familyParentId">
            <button type="button" class="new-subagent-btn" (click)="onNewSubagent()">
                <span class="material-icons">add</span>
                {{ 'CDSCanvas.NewSubagent' | translate }}
            </button>
        </div>
    </div>

</div>
