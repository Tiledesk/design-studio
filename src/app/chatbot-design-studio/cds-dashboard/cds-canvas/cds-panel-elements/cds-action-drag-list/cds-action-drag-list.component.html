<!-- Le voci si trascinano col meccanismo del browser, non con quello del CDK: la riga non viene
     staccata dall'elenco, resta dov'e' per tutto il gesto, e quello che segue il puntatore e'
     una sua istantanea. Il rilascio lo raccoglie il flusso. -->
<div class="action-list">
  <div class="menu-dragging">
    <div class="action-box" *ngFor="let item of items; let i = index;"
        [class.is-disabled]="item.value.disabled"
        [draggable]="!item.value.disabled"
        (dragstart)="onDragStart($event, item); nameTip.hide(0)"
        (dragend)="isDragging.emit(false)">

      <!-- Il nome per intero, ma solo dove la riga non riesce a mostrarlo: a deciderlo e'
           onRowEnter, misurando il testo. Un riquadro che ripete un nome gia' leggibile copre la
           riga accanto per non dire niente. -->
      <div class="actions-btns-wpr" #divAction
          [class.disabled]="item.value.disabled"
          [attr.title]="item.value.tooltip ? (item.value.tooltip | translate) : null"
          [matTooltip]="item.value.name | translate"
          #nameTip="matTooltip"
          matTooltipClass="cds-mat-tooltip"
          matTooltipPosition="right"
          [matTooltipShowDelay]="NAME_TOOLTIP_DELAY_MS"
          (mouseenter)="onRowEnter(divAction, nameTip, item)"
          (click)="itemClick.emit(item)"
          [attr.id]="'menu-trigger-' + i">

        <div *ngIf="item.value.src && item.value.name" class="action-btn-icon">
          <img *ngIf="isUrlIcon(item.value.src); else nativeIcon"
               class="connector-action-icon" [src]="item.value.src" alt="" aria-hidden="true">
          <ng-template #nativeIcon>
            <mat-icon class="svg-icon" [svgIcon]="item.value.src" aria-hidden="true"></mat-icon>
          </ng-template>
        </div>
        <div *ngIf="item.value.name" class="action-btn-text truncate">{{item.value.name | translate}}</div>
        <span *ngIf="!item.canLoad" class="trigger-beta-badge">PRO</span>
        <span *ngIf="item.value.badge" [class]="'trigger-beta-badge badge-' + item.value.badge">{{item.value.badge}}</span>

        <button type="button" class="action-info-btn"
            [attr.aria-label]="'CDSCanvas.ActionInfo' | translate"
            (mouseenter)="nameTip.hide(0); onHover(divAction, item.value)"
            (mouseleave)="leaveItem.emit()"
            (click)="$event.stopPropagation()">
          <mat-icon class="svg-icon" svgIcon="info" aria-hidden="true"></mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>
