<div *ngIf="!initFinished" class="loader">
</div>

<div *ngIf="initFinished" (wheel)="onSwipe($event)">
    <cds-header 
        class="cds-header" 
        [IS_OPEN_SIDEBAR]="IS_OPEN_SIDEBAR" 
        [selectedChatbot]="selectedChatbot"
        (goToBck)="goBack()"
        (toggleSidebarWith)="onToggleSidebarWith($event)">
    </cds-header>

    <div id="chatbot--dashboard" 
        class="chatboat-dashboard" 
        [class.is_opened_sidebar]="IS_OPEN_SIDEBAR">

        <!-- <cds-changelog *ngIf="showChangelog" 
            (onClose)="onCloseChangelog()">
        </cds-changelog> -->

        <cds-sidebar class="cds-sidebar"
            [IS_OPEN_SIDEBAR]="IS_OPEN_SIDEBAR">
        </cds-sidebar>

        <!-- Mounted here, not inside cds-canvas, so a flow switch can destroy
             and rebuild the canvas without taking the iframe -- and the
             conversation inside it -- with it. Still before the outlet in this
             flex row, so it opens as a column rather than an overlay.
             Gated to the blocks section (same condition cds-header uses for
             its own toggle button) so it still disappears when the user
             leaves blocks entirely -- a flow switch never does that, so this
             cannot flicker the iframe out from under an active conversation. -->
        <cds-panel-agent-chat *ngIf="isBlockSectionActive"
            [class.isVisible]="IS_OPEN_PANEL_AGENT_CHAT"
            [class.isHidden]="!IS_OPEN_PANEL_AGENT_CHAT"
            [isPanelVisible]="IS_OPEN_PANEL_AGENT_CHAT">
        </cds-panel-agent-chat>

        <router-outlet></router-outlet>

    </div>

    <cds-popup></cds-popup>
    
</div>
