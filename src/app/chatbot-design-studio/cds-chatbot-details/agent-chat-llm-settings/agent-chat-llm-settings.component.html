<div class="llm-settings">
  <h3>{{ 'LlmSettingsTitle' | translate }}</h3>
  <p class="scope-note">{{ 'LlmSettingsProjectScope' | translate }}</p>

  <div *ngIf="loading">{{ 'Loading' | translate }}</div>

  <div class="error" *ngIf="error">{{ error }}</div>

  <form *ngIf="!loading" (ngSubmit)="save()">
    <label for="llm-model">{{ 'LlmSettingsModel' | translate }}</label>
    <select id="llm-model" [ngModel]="selectedModelId" name="model"
            [disabled]="readOnly"
            (ngModelChange)="onModelChange($event)">
      <option *ngFor="let m of models" [value]="m.id">
        {{ m.label }}<span *ngIf="m.default"> — {{ 'LlmSettingsDefault' | translate }}</span>
      </option>
    </select>

    <label>
      <input type="checkbox" [(ngModel)]="useDeploymentDefault" name="useDefault"
             [disabled]="readOnly">
      {{ 'LlmSettingsUseDefault' | translate }}
    </label>

    <label for="llm-temperature">{{ 'LlmSettingsTemperature' | translate }}</label>
    <input id="llm-temperature" type="number" step="0.1" min="0" max="2"
           [(ngModel)]="temperature" name="temperature" [disabled]="readOnly">

    <label for="llm-max-tokens">{{ 'LlmSettingsMaxTokens' | translate }}</label>
    <input id="llm-max-tokens" type="number" min="1"
           [(ngModel)]="maxTokens" name="maxTokens" [disabled]="readOnly">

    <button type="submit" [disabled]="readOnly || saving">
      {{ 'LlmSettingsSave' | translate }}
    </button>
    <span class="saved" *ngIf="saved">{{ 'LlmSettingsSaved' | translate }}</span>
  </form>
</div>
